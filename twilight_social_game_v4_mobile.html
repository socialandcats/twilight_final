function home(){state=null;chosen=null;inputs=[];locked=false;view='home';html(`<section class="home"><div class="eyebrow">Форкс • четыре судьбы • одна тайна</div><h1>На чьей ты стороне?</h1><p class="intro">Вольтури получили сообщение: человек знает о вампирах. Проживи историю героя, собери защитное досье и сохрани тайну. Каждая ошибка оставляет след — каждый верный вывод помогает его скрыть.</p><div class="cards">${names.map(k=>{const r=DATA.routes[k];return `<button class="card" data-hero="${k}"><div class="art" style="--pos:${pos(k)}"></div><span class="badge">${achievements[k]?'Пройдено · '+achievements[k]+'/18':'12 сцен + суд'}</span><div class="cardcopy"><h2>${r.name}</h2><div class="desc">${r.subtitle}</div><div class="tag">ПРОЖИТЬ ИСТОРИЮ →</div></div></button>`}).join('')}</div><div class="rules"><span>Выбор · сопоставление · суждения · пропуски</span><span><b>Ошибка: +2 к подозрению.</b> Верный ответ: −1.</span><span>6/6 → задержание и повторная проверка</span></div><div class="watermark">Учебная фанатская история по мотивам саги. Сценарные эпизоды адаптированы для обществознания; ответы основаны на четырёх присланных скриптах. Игра сохраняет только результаты пройденных маршрутов.</div></section>`);surface.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>start(b.dataset.hero))}
function start(k){state={hero:k,index:0,court:false,risk:0,trust:3,correct:0,log:[],detentions:0,last:'',chapterSeen:-1,helpUsed:false};view='story';chapter()}
function overlay(content){const o=document.createElement('div');o.className='overlay';o.innerHTML=content;surface.append(o);return o}
function chapter(){const r=DATA.routes[state.hero],n=Math.floor(state.index/4);state.chapterSeen=n;render();const o=overlay(`<div class="dialog chapter"><div class="eyebrow">${r.name} · глава ${n+1} / 3</div><div class="number">0${n+1}</div><h1>${r.chapters[n]}</h1><p>${n===0?r.goal:n===1?'Первый след уже оставлен. Теперь решения определят, насколько близко Вольтури подойдут к твоим друзьям.':state.risk>=3?'Посланник уже следит за тобой. Следующие записи в досье должны выдержать особенно внимательную проверку.':'Твоя осторожность дала союзникам время. Осталось собрать доказательства и подготовиться к встрече с Аро.'}</p><p class="checkpoint">Одно задание — одна попытка. После ответа ты увидишь разбор. При 6/6 подозрения нужно заново решить ошибочную сцену.</p><button class="primary" id="enter">Продолжить историю</button></div>`);o.querySelector('#enter').onclick=()=>o.remove()}
function current(){return state.court?DATA.court[state.index]:DATA.routes[state.hero].scenes[state.index]}
function render(){view='story';chosen=null;locked=false;const s=current(),r=DATA.routes[state.hero];inputs=s.type==='choice'?[null]:Array((s.rows||s.answer).length).fill(null);state.helpUsed=false;html(`<section class="story"><aside class="portrait ${state.court?'courtart':''}">${state.court?'<div class="arch"></div><div class="crest">V</div>':`<div class="art" style="--pos:${pos(state.hero)};--portrait-y:${state.hero==='edward'?'15%':'33%'}"></div>`}<div class="mist"></div><div class="portraitcopy"><div class="location">${state.court?'ВОЛЬТЕРРА · ЗАЛ СОВЕТА':state.index<4?'ФОРКС · ПЕРВЫЕ СЛЕДЫ':state.index<8?'ЛЕС · ГРАНИЦА ТАЙНЫ':'ДОРОГА В ВОЛЬТЕРРУ'}</div><h2>${state.court?'Вольтури':r.name}</h2><p>${state.court?'«У каждого общества есть правила. Даже у бессмертных».':r.quote}</p></div></aside><section class="work"><div class="hud"><span>${state.court?'СУД':r.chapters[Math.floor(state.index/4)].toUpperCase()} · ${state.index+1}/${state.court?6:12}</span><div class="riskwrap"><span class="trust">ДОВЕРИЕ ${state.trust}/5</span><span class="danger">ПОДОЗРЕНИЕ ${state.risk}/6</span><span class="riskbar"><i style="width:${state.risk/6*100}%"></i></span></div></div><div class="steps">${Array.from({length:state.court?6:12},(_,i)=>`<i class="${i<state.index?'done':i===state.index?'now':''}"></i>`).join('')}</div><h1>${s.title}</h1><p class="narration">${s.story}</p>${state.last?`<p class="consequence">${state.last}</p>`:''}<p class="prompt">${s.prompt}</p><div class="interaction" id="interaction">${interaction(s)}</div><div id="feedback"></div><div class="footer"><button class="ghost" id="help">Заметки Карлайла · +1 подозрение</button><button class="primary" id="submit" disabled>Подтвердить решение</button></div></section></section>`);wire(s);$('help').onclick=help;$('submit').onclick=submit}
function interaction(s){if(s.type==='choice')return `<div class="choices">${s.options.map((t,i)=>`<button class="option" data-choice="${i}">${esc(t)}</button>`).join('')}</div>`;
if(s.type==='truth')return s.rows.map((t,i)=>`<div class="row" data-row="${i}"><span class="label">${esc(t)}</span><div class="bool"><button data-bool="${i}:true">Верно</button><button data-bool="${i}:false">Неверно</button></div></div>`).join('');
if(s.type==='match')return `<div class="board"><div>${s.rows.map((t,i)=>`<div class="row"><span class="label">${esc(t)}</span>${slot(i)}</div>`).join('')}</div><div class="bank">${terms(s)}</div></div>`;
let i=0;return `<div class="gaptext">${s.text.split('__').map((t,j)=>esc(t)+(j<s.answer.length?slot(i++):'')).join('')}</div><div class="bank">${terms(s)}</div>`}
function slot(i){return `<button class="slot" data-slot="${i}" aria-label="Позиция ${i+1}">+ выбрать термин</button>`}function terms(s){return s.terms.map((t,i)=>`<button class="term" draggable="true" data-term="${i}">${esc(t)}</button>`).join('')}
function complete(){const b=$('submit');if(b)b.disabled=inputs.some(x=>x===null)}
function wire(s){surface.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;inputs[0]=+b.dataset.choice;surface.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b));complete()});surface.querySelectorAll('[data-bool]').forEach(b=>b.onclick=()=>{if(locked)return;const [i,v]=b.dataset.bool.split(':');inputs[+i]=v==='true';surface.querySelectorAll(`[data-bool^="${i}:"]`).forEach(x=>x.classList.toggle('selected',x===b));complete()});surface.querySelectorAll('[data-term]').forEach(b=>{b.onclick=()=>{if(locked)return;chosen=+b.dataset.term;paint(s);if(innerWidth<=900&&s.type==='match'){const empty=surface.querySelector('[data-slot]:not(.filled)');if(empty)empty.scrollIntoView({behavior:'smooth',block:'center'})}};b.ondragstart=e=>{if(locked){e.preventDefault();return}chosen=+b.dataset.term;e.dataTransfer.setData('text/plain',b.dataset.term);paint(s)}});surface.querySelectorAll('[data-slot]').forEach(b=>{b.onclick=()=>{if(locked)return;const i=+b.dataset.slot;if(chosen===null){inputs[i]=null;paint(s);return}assign(s,i,chosen)};b.ondragover=e=>{if(!locked)e.preventDefault()};b.ondrop=e=>{e.preventDefault();if(locked)return;const n=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(n)&&n>=0&&n<s.terms.length)assign(s,+b.dataset.slot,n)}})}
function assign(s,i,n){const old=inputs.indexOf(n);if(old>=0)inputs[old]=null;inputs[i]=n;chosen=null;paint(s);complete()}
function paint(s){surface.querySelectorAll('[data-slot]').forEach(b=>{const n=inputs[+b.dataset.slot];b.textContent=n===null?'+ выбрать термин':s.terms[n];b.classList.toggle('filled',n!==null)});surface.querySelectorAll('[data-term]').forEach(b=>{b.classList.toggle('selected',+b.dataset.term===chosen);b.classList.toggle('used',inputs.includes(+b.dataset.term))});complete()}
function key(s){if(s.type==='choice')return s.options[s.answer];if(s.type==='truth')return s.rows.map((t,i)=>`${i+1}: ${s.answer[i]?'верно':'неверно'}`).join(' · ');return s.answer.map((n,i)=>`${i+1}: ${s.terms[n]}`).join(' · ')}
function submit(){if(locked||inputs.some(x=>x===null))return;locked=true;const s=current(),ans=s.type==='choice'?[s.answer]:s.answer,ok=inputs.every((v,i)=>v===ans[i]);state.correct+=ok?1:0;state.risk=Math.min(6,Math.max(0,state.risk+(ok?-1:2)));state.trust=Math.max(0,Math.min(5,state.trust+(ok?1:-1)));state.log.push({title:s.title,ok,type:s.type,explain:s.explain,key:key(s)});state.last=ok?(state.risk>=3?'Досье стало точнее, но слежка продолжается. Посланник не теряет тебя из виду.':'Точный вывод закрыл один из следов. Союзники успели подготовить следующий шаг.'):(state.hero==='alice'?'В видении появляется новый свидетель. Твоя ошибка сузила время, оставшееся до прибытия посланника.':state.hero==='jacob'?'Стая сомневается в твоих доводах. Посланник использует неточность, чтобы поставить союз под вопрос.':state.hero==='bella'?'В досье обнаружили противоречие. Теперь посланник пристальнее следит за твоим переходом в новый круг.':'В твоей защите обнаружилась слабость. Семья теряет доверие, а Вольтури получают ещё один повод вмешаться.');
if(s.type==='choice')surface.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;const n=+b.dataset.choice;b.classList.toggle('right',n===s.answer);b.classList.toggle('wrong',n===inputs[0]&&!ok)});else if(s.type==='truth')surface.querySelectorAll('[data-row]').forEach(b=>b.classList.add(inputs[+b.dataset.row]===ans[+b.dataset.row]?'good':'bad'));else surface.querySelectorAll('[data-slot]').forEach(b=>b.classList.add(inputs[+b.dataset.slot]===ans[+b.dataset.slot]?'good':'bad'));
surface.querySelectorAll('.term,.slot,.bool button').forEach(b=>b.disabled=true);$('help').disabled=true;$('feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><b>${ok?'След скрыт · подозрение −1':'След оставлен · подозрение +2, доверие −1'}</b>${esc(s.explain)}${ok?'':`<div class="answerkey">Ответ: ${esc(key(s))}</div>`}</div>`;$('submit').textContent=state.risk>=6?'Вольтури задерживают тебя':'Продолжить →';$('submit').disabled=false;$('submit').onclick=()=>state.risk>=6?detain():next();updateHud()}
function updateHud(){const h=surface.querySelector('.hud .riskwrap');h.innerHTML=`<span class="trust">ДОВЕРИЕ ${state.trust}/5</span><span class="danger">ПОДОЗРЕНИЕ ${state.risk}/6</span><span class="riskbar"><i style="width:${state.risk/6*100}%"></i></span>`}
function help(){if(locked||state.helpUsed)return;state.helpUsed=true;state.risk=Math.min(6,state.risk+1);$('help').disabled=true;updateHud();const o=overlay(`<div class="dialog"><div class="eyebrow">Заметки Карлайла · подозрение +1</div><h1>Проверь основание</h1><p>${esc(current().explain)}</p><p class="checkpoint">Посланник заметил обращение за помощью. Если подозрение достигло 6, после ответа последует задержание.</p><button class="primary">Вернуться к решению</button></div>`);o.querySelector('button').onclick=()=>o.remove()}
function detain(){state.detentions++;const s=current();const o=overlay(`<div class="dialog"><div class="eyebrow danger">Критическое подозрение · 6 / 6</div><h1>Ты задержан Вольтури</h1><p>Посланник остановил путь к союзникам. Аро требует восстановить последнюю запись. Прочитай разбор, затем собери ответ заново без подсказки.</p><p>${esc(s.explain)}</p><p class="checkpoint">Перепроверка не возвращает балл и не отменяет задержание. Верный ответ снижает подозрение до 3 и позволяет продолжить историю.</p><button class="primary" id="repairStart">Пройти перепроверку</button></div>`);o.querySelector('#repairStart').onclick=()=>{o.remove();repair()}}
function repair(){const s=current();chosen=null;locked=false;inputs=s.type==='choice'?[null]:Array(s.answer.length).fill(null);$('interaction').innerHTML=interaction(s);$('feedback').innerHTML='<div class="feedback bad"><b>Перепроверка · без дополнительных баллов</b>Восстанови ответ, чтобы Вольтури разрешили тебе продолжить.</div>';wire(s);$('submit').textContent='Восстановить досье';$('submit').disabled=true;$('submit').onclick=()=>{const ans=s.type==='choice'?[s.answer]:s.answer;if(inputs.every((v,i)=>v===ans[i])){state.risk=3;state.last='Ты восстановил запись. Посланник отпустил тебя под наблюдение: подозрение остаётся на уровне 3/6.';next()}else{$('feedback').innerHTML=`<div class="feedback bad"><b>Противоречие осталось</b>${esc(s.explain)}<div class="answerkey">${esc(key(s))}</div></div>`}}}
function next(){state.index++;if(state.index===(state.court?6:12)){state.court?report():routeDone();return}if(!state.court&&state.index%4===0){chapter()}else render()}
function routeDone(){view='interlude';const r=DATA.routes[state.hero];html(`<section class="report"><div class="eyebrow">${r.name} · маршрут завершён</div><h1>${state.trust>=3?'Союзники на твоей стороне':'Доверие придётся восстановить'}</h1><p>${state.hero==='bella'?'Ты дописала досье о своём переходе. Эдвард ждёт у машины: теперь решение предстоит защитить перед Аро.':state.hero==='edward'?'Белла в безопасности. Ты собрал доводы и признал границы своих поступков. Карлайл едет с тобой на встречу с Аро.':state.hero==='alice'?'Первое разоблачение предотвращено. Но посланник уже видел следы. Ты берёшь журнал реакций и отправляешься менять последнее видение.':'Ты помог союзникам и сформулировал новый договор. Стая ждёт твоего возвращения: Аро должен услышать, почему выбор был осознанным.'}</p><div class="stats"><div class="stat"><b>${state.correct}/12</b><span>Точных решений</span></div><div class="stat"><b>${state.risk}/6</b><span>Подозрение переходит в суд</span></div><div class="stat"><b>${state.detentions}</b><span>Задержаний</span></div></div><p>В суде ещё 6 сцен. Ошибки и уровень доверия продолжают влиять на итог истории.</p><div class="actions"><button class="primary" id="court">Войти в зал Вольтури</button><button class="secondary" id="other">Выбрать другого героя</button></div></section>`);$('court').onclick=()=>{state.court=true;state.index=0;state.last=state.risk>=3?'Из-за накопленных противоречий Аро начинает допрос без приветствий.':'Союзники подтвердили твоё досье. Аро приглашает тебя выступить первым.';render()};$('other').onclick=home}
function report(){view='ending';const perfect=state.correct>=16&&state.detentions===0,free=state.correct>=12&&state.trust>=3;const title=perfect?'Тайна под твоей защитой':free?'Союз выдержал испытание':state.correct>=9?'Свобода под наблюдением':'Вольтури ограничили твою свободу';const ending=perfect?'Аро принимает досье и отзывает посланника. Ты возвращаешься к союзникам: точность выводов и осторожность помогли сохранить тайну.':free?'Аро разрешает тебе вернуться. Союзники поддержали твои решения, хотя некоторые страницы досье пришлось исправить.':state.correct>=9?'Тебя отпускают, но посланник останется в Форксе. Ошибки оставили следы: следующий маршрут поможет восстановить недостающие связи.':'Аро требует постоянного сопровождения посланника. Ты сохранил возможность вернуться, но самостоятельный путь придётся заслужить точным пониманием норм.';achievements[state.hero]=Math.max(achievements[state.hero]||0,state.correct);save();html(`<section class="report"><div class="eyebrow">${DATA.routes[state.hero].name} · финал</div><h1>${title}</h1><p>${ending}</p><div class="stats"><div class="stat"><b>${state.correct}/18</b><span>Точных решений</span></div><div class="stat"><b>${state.trust}/5</b><span>Доверие союзников</span></div><div class="stat"><b>${state.detentions}</b><span>Задержаний</span></div></div><div class="eyebrow">Записи, которые стоит повторить</div><div class="journal">${state.log.filter(x=>!x.ok).length?state.log.filter(x=>!x.ok).map(x=>`<details><summary>${esc(x.title)}</summary><p>${esc(x.explain)}</p><p>${esc(x.key)}</p></details>`).join(''):'<p>Досье без ошибок. Попробуй другую историю: ситуации и понятия изменятся.</p>'}</div><div class="actions"><button class="primary" id="other">Выбрать другого героя</button><button class="secondary" id="again">Повторить историю</button></div><div class="watermark">Финал учитывает точность, доверие и задержания. За перепроверки баллы не начисляются.</div></section>`);$('other').onclick=home;$('again').onclick=()=>start(state.hero)}
$('menu').onclick=()=>{if(view==='home')return;if(view==='ending'||view==='interlude'){home();return}const o=overlay('<div class="dialog"><div class="eyebrow">Вернуться к выбору героя</div><h1>Оставить эту историю?</h1><p>Текущий маршрут начнётся заново. Результаты завершённых историй сохранятся.</p><div class="actions"><button class="secondary" id="stay">Продолжить</button><button class="primary" id="leave">Выбрать героя</button></div></div>');o.querySelector('#stay').onclick=()=>o.remove();o.querySelector('#leave').onclick=home};
const forest=document.querySelector('.forest');for(let i=0;i<17;i++){const t=document.createElement('i');t.className='tree';t.style.left=`${i*78-20}px`;t.style.height=`${330+(i*97)%330}px`;t.style.opacity=.35+(i%4)*.15;forest.append(t)}
function resize(){if(innerWidth<=900){$('frame').style.width='100%';$('frame').style.height='auto';$('game').style.transform='none';return}const s=Math.min(1,innerWidth/1192,innerHeight/740);$('frame').style.width=1192*s+'px';$('frame').style.height=740*s+'px';$('game').style.transform=`scale(${s})`}addEventListener('resize',resize);resize();home();
</script></body></html>
